name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - "1.10"   # LTS
          - "1"      # stable
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0

      # Install Rust toolchain for building the companion crate
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Build the Rust cdylib (with icechunk feature, enabled by default)
      - name: Build libzarrs_jl
        run: julia --project deps/build.jl

      # Run core tests
      - name: Run tests
        uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1

  test-icechunk:
    name: Icechunk tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1"

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build libzarrs_jl
        run: julia --project deps/build.jl

      - name: Instantiate test environment
        run: julia --project -e 'using Pkg; Pkg.instantiate()'

      - name: Run Icechunk tests
        run: julia --project -e '
          using Pkg; Pkg.test(test_args=["icechunk"])'

  test-no-icechunk:
    name: Tests without icechunk feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1"

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build libzarrs_jl without icechunk
        run: |
          cd deps/zarrs_jl
          cargo build --release --no-default-features
          cd ../..
          julia --project deps/build.jl

      - name: Run core tests (no icechunk)
        run: julia --project -e '
          using Pkg; Pkg.test(test_args=["core"])'

  compat:
    name: Cross-language compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1"

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Install uv for Python fixture generation
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build libzarrs_jl
        run: julia --project deps/build.jl

      - name: Instantiate test environment
        run: julia --project -e 'using Pkg; Pkg.instantiate()'

      # Generate fixtures
      - name: Generate Python fixtures
        run: uv run test/fixtures/generate_python.py

      - name: Generate Zarrs.jl fixtures
        run: julia --project test/fixtures/generate_zarrs_jl.jl

      # Run compatibility tests
      - name: Python compatibility tests
        run: julia --project -e '
          using Pkg; Pkg.test(test_args=["compat_zarr_python"])'

      - name: Zarrs.jl self-compatibility tests
        run: julia --project -e '
          using Pkg; Pkg.test(test_args=["compat_zarrs"])'

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1"

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build libzarrs_jl
        run: julia --project deps/build.jl

      - name: Install dependencies
        run: julia --project=docs -e '
          using Pkg;
          Pkg.develop(PackageSpec(path=pwd()));
          Pkg.instantiate()'

      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl

  bindings:
    name: Generated bindings up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          # Pinned (with gen/Manifest.toml) so regenerating is reproducible:
          # Clang.jl's libclang comes from the Julia version's libLLVM_jll.
          version: "1.13"

      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cbindgen
        run: cargo install cbindgen --version "$(cat gen/cbindgen-version)" --locked

      - name: Regenerate zarrs_jl.h and LibZarrs.jl
        run: |
          julia --project=gen -e 'using Pkg; Pkg.instantiate()'
          julia --project=gen gen/generator.jl

      - name: Check for differences
        run: |
          if ! git diff --exit-code -- deps/zarrs_jl/zarrs_jl.h src/LibZarrs.jl; then
            echo "::error::Generated bindings are out of date. Run gen/generator.jl and commit the result (see docs/src/internals.md)."
            exit 1
          fi
